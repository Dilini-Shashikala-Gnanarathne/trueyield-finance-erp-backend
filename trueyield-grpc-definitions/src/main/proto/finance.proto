syntax = "proto3";

package finance;

option java_package = "com.financeapp.finance.grpc.proto";
option java_outer_classname = "FinanceProto";
option java_multiple_files = true;

service FinanceService {
    rpc CreateJournalEntry(CreateJournalEntryRequest)
        returns (CreateJournalEntryResponse);
}

message CreateJournalEntryRequest {
    string reference = 1;
    string description = 2;
    string debit_account = 3;
    string credit_account = 4;
    string amount = 5;
    string currency = 6;
    string source_system = 7;
    JournalEntryType entry_type = 8;
}

message CreateJournalEntryResponse {
    string journal_reference = 1;
    JournalStatus status = 2;
    string message = 3;
    bool was_idempotent = 4;
    string created_at = 5;
}
enum JournalEntryType {
    JOURNAL_ENTRY_TYPE_UNSPECIFIED = 0;
    PAYROLL                        = 1;
    ACCOUNTS_PAYABLE               = 2;
    ACCOUNTS_RECEIVABLE            = 3;
    GENERAL_LEDGER                 = 4;
}

enum JournalStatus {
    JOURNAL_STATUS_UNSPECIFIED = 0;
    CREATED                    = 1;
    POSTED                     = 2;
    REVERSED                   = 3;
    FAILED                     = 4;
}
