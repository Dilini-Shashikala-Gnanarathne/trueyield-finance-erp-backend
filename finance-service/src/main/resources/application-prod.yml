# =============================================================================
# Finance Service — Production Profile
# =============================================================================
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.financeapp.finance: INFO
    org.hibernate: WARN
