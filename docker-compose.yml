# =============================================================================
# Finance ERP — Docker Compose
#
# Services:
#   postgres             — PostgreSQL (finance_db + user_management_db)
#   auth-service         — User management & identity microservice (REST :8085)
#   finance-service      — Finance microservice (REST :8082 / gRPC :9090)
#   marketplace-service  — Marketplace microservice
#   api-gateway          — Spring Cloud Gateway (:8080)
#
# Startup order: postgres → finance → auth → marketplace → gateway
# =============================================================================

networks:
  finance-erp-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local

services:

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile

  marketplace-service:
    build:
      context: ./backend
      dockerfile: marketplace-service/Dockerfile

  finance-service:
    build:
      context: ./backend
      dockerfile: finance-service/Dockerfile

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile

